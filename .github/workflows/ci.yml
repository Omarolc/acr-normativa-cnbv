name: CI -- Seis compuertas
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  compuertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: "Compuerta A -- estilo (ruff)"
        run: python -m ruff check . --exclude dashboard
      - name: "Compuerta B -- tipos (mypy --strict)"
        run: python -m mypy --strict src
      - name: "Compuerta C -- pruebas (pytest)"
        run: python -m pytest -q
      - name: "Compuerta C2 -- cobertura 100% del motor"
        run: python -m pytest -q --cov=acr.motor --cov=acr.entrada --cov=acr.persistencia --cov=acr.udis --cov=acr.expediente --cov-fail-under=100
      - name: "Compuerta D -- cero literales normativos"
        run: python tools/gate_literales.py --sprint ACR-04
      - name: "Compuerta E -- reproducibilidad (hash identico)"
        run: python tools/gate_reproducibilidad.py
      - name: "Compuerta V -- bloqueo por vigencia"
        run: python tools/gate_vigencia.py
      - name: "Compuerta X -- determinismo del expediente"
        run: python tools/gate_expediente.py
      - name: "Compuerta PII -- sin datos de socios versionados"
        run: python tools/gate_pii.py
