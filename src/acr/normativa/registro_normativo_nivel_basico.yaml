# =============================================================================
# REGISTRO NORMATIVO — SOCAP CON NIVEL DE OPERACIONES BÁSICO
# =============================================================================
# Fuentes verificadas:
#   - LRASCAP, última reforma DOF 14-11-2025
#   - Disposiciones de carácter general aplicables a las actividades de las
#     SOCAP, texto compilado al 07-07-2026
#
# PRINCIPIO DE ALCANCE (crítico):
#   Disposiciones, Art. 1, fracc. LXVIII define "Sociedad" = SOCAP niveles I-IV.
#   Fracc. LXIX define por separado "SOCAP con Nivel de Operaciones Básico".
#   => Todo artículo de las Disposiciones que diga "las Sociedades" NO aplica
#      a Nivel Básico. Verificado: fuera del Título Primero Capítulo Único
#      (Arts. 1 Bis a 1 Bis 7) no hay mención a Nivel Básico en el articulado.
# =============================================================================

meta:
  version_registro: "2026.08.01"
  vigencia_desde: "2026-07-07"
  fecha_corte_conocimiento: "2026-08-04"
  revisar_antes_de: "2027-01-01"   # ver bloque `alertas_vigencia`

# -----------------------------------------------------------------------------
alertas_vigencia:
  - id: REF-2027-ANEXOS
    fecha_entrada_vigor: "2027-01-01"
    descripcion: >
      Resolución DOF 09-04-2024 (con entrada en vigor diferida por Resolución
      DOF 27-12-2025) sustituye los Anexos A, B, C, C Bis 1, E, F, J, M, Ñ, T y U,
      y adiciona el Anexo C Bis 2. Afecta directamente el catálogo contable
      (Anexo T) y los formatos de entrega (Anexo U) de Nivel Básico.
    accion: >
      El motor debe rechazar la generación de reportes con fecha de corte
      >= 2027-01-01 mientras este registro no incorpore los anexos sustituidos.
  - id: REF-2027-NIF
    fecha_entrada_vigor: "2027-01-01"
    descripcion: >
      NIF B-17, C-3, C-9, C-16, C-19, C-20, D-1, D-2 y D-5 referidas en el
      Criterio A-2 del Anexo E entran en vigor el 01-01-2027.
  - id: ANEXO-V-2026
    fecha_entrada_vigor: "2026-07-07"
    descripcion: >
      Resolución DOF 07-07-2026 adiciona el ANEXO V "Formatos para la remisión
      de información a la CNBV". Pendiente de evaluar aplicabilidad a Básico.

# -----------------------------------------------------------------------------
ambito:
  entidad: "SOCAP con Nivel de Operaciones Básico"
  criterio_pertenencia:
    regla: "activos_totales <= 2500000 UDIS"
    fundamento: "LRASCAP Art. 13"
    condicion_adicional: >
      Solo se considera Nivel Básico la sociedad REGISTRADA conforme al Art. 7
      LRASCAP. Sin registro (o cancelado) no tiene ese carácter.
  supervisor_directo: "Comité de Supervisión Auxiliar (FOCOOP)"
  nota_contraparte: >
    La CNBV NO es receptora directa de la información de Nivel Básico.
    El CSA entrega a la CNBV la clasificación vía reporte A-2113 (Serie R21,
    Anexo M). La cooperativa NO presenta el A-2113.
  fundamento_contraparte: ["Disposiciones Art. 1 Bis 1", "Art. 1 Bis 6", "Art. 1 Bis 7"]

# -----------------------------------------------------------------------------
disparadores:
  - id: EXCESO_LIMITE_ACTIVOS
    condicion: "activos_totales > 2500000 UDIS"
    fundamento: "LRASCAP Art. 16"
    plazo_dias: 150
    obligacion: >
      Presentar al Comité de Supervisión Auxiliar la solicitud de autorización
      para operar con nivel distinto al básico. Puede continuar operando hasta
      que la Comisión resuelva, siempre que la solicitud lleve dictamen
      favorable del CSA.
    severidad: CRITICA

# -----------------------------------------------------------------------------
capitalizacion:
  capital_neto:
    fundamento: "Disposiciones Art. 1 Bis 4"
    formula: "capital_contable - certificados_no_elegibles - financiamientos_para_partes_sociales"
    componentes:
      - id: capital_contable
        signo: "+"
      - id: certificados_no_elegibles
        signo: "-"
        descripcion: >
          Certificados excedentes o voluntarios (Art. 51 Ley de Cooperativas)
          que NO cumplen las características del Art. 1 Bis 5.
      - id: financiamientos_para_partes_sociales
        signo: "-"
        descripcion: >
          Financiamientos y aportaciones a título oneroso, incluidos accesorios,
          cuyos recursos directa o indirectamente se destinen a adquirir partes
          sociales o títulos del capital de la propia sociedad.
    NO_restar:  # errores frecuentes tomados del régimen I-IV
      - activos_intangibles
      - creditos_a_contraventores

  requerimiento:
    fundamento: "Disposiciones Art. 1 Bis 3"
    formula: "0.08 * cartera_creditos_neta_de_provisiones"
    factor: 0.08

  nivel_capitalizacion:
    formula: "capital_neto / requerimiento * 100"
    periodicidad_computo: trimestral
    base: "saldos al último día del mes"
    fundamento: "Disposiciones Art. 1 Bis 6"
    casos_borde:
      requerimiento_cero:
        significado: "Sin cartera de crédito neta: no hay requerimiento que incumplir."
        tratamiento: "cumplimiento_pleno"   # NO clasificar D
      capital_neto_negativo:
        tratamiento: "nivel = 0; categoría D"

  certificados_elegibilidad:
    fundamento: "Disposiciones Art. 1 Bis 5"
    requisitos:
      - id: programa_asamblea
        descripcion: "Programa aprobado por Asamblea General con importe máximo y duración."
      - id: plazo_definido
        descripcion: "Plazo determinado por la Asamblea; liquidables al vencimiento salvo renovación automática con programa vigente."
      - id: numerados_mismo_valor
      - id: tasa_maxima
        regla: "tasa_rendimiento <= 1.50 * CCP_a_fecha_de_emision"
        nota: "El CCP es el de la FECHA DE EMISIÓN, no el vigente al corte. La tasa solo se paga si hay remanente en el ejercicio."
      - id: terminos_pago
        descripcion: "Término de pago, condiciones, forma de devolución, lugar y modo de pago."
      - id: leyenda_no_deposito
        texto_requerido: "Estos certificados son aportaciones al capital social de la Sociedad y no constituyen depósitos"
      - id: leyenda_retiro
        texto_requerido: "El tenedor de este certificado podrá solicitar el retiro del mismo, siempre y cuando dicho retiro no resulte en un incumplimiento a los requerimientos de capitalización que debe observar la Sociedad"
    exencion:
      descripcion: "Certificados de capital no retirable provenientes de programas gubernamentales quedan exentos de este artículo."

# -----------------------------------------------------------------------------
clasificacion:
  fundamento: "LRASCAP Art. 15"
  evaluador: "Comité de Supervisión Auxiliar"
  periodicidad_evaluacion: semestral
  cifras_base: ["junio", "diciembre"]
  publicacion: ["septiembre", "marzo"]
  advertencia_implementacion: >
    La categoría NO es función únicamente del porcentaje. Depende también del
    apego a las reglas de elaboración y presentación de estados financieros y
    del historial de clasificaciones. Un motor puramente numérico clasifica mal.
  categorias:
    - id: A
      nivel_min: 150
      nivel_max: null
      condiciones_adicionales: ["eeff_cumplen_reglas == true"]
      riesgo: "bajo"
    - id: B
      nivel_min: 100
      nivel_max: 150
      condiciones_adicionales: ["eeff_cumplen_reglas == true"]
      riesgo: "moderadamente bajo"
    - id: C
      nivel_min: 50
      nivel_max: 100
      via_alterna:
        descripcion: "También cae en C la sociedad con nivel >= 100 que NO se apega a las reglas de elaboración y presentación de EEFF."
        condicion: "nivel >= 100 and eeff_cumplen_reglas == false"
      riesgo: "insolvencia si no adopta medidas correctivas inmediatas"
    - id: D
      nivel_max: 50
      condicion_compuesta: >
        nivel < 50 Y (no presentó EEFF en plazos/términos de las disposiciones
        O —si estaba clasificada en C conforme al Art. 15-III— no los presentó
        en la forma determinada).
      efecto: >
        Debe abstenerse de celebrar operaciones de captación e iniciar
        disolución y liquidación. La abstención de captación surte a partir del
        día siguiente a que surta efectos la notificación (Art. 15 Bis).
  reglas_de_estado:
    - id: DOS_C_CONSECUTIVAS
      condicion: "categorias_previas[-2:] == ['C','C']"
      resultado: "D"
      fundamento: "LRASCAP Art. 15-III"
      requiere_persistencia: true
    - id: INCUMPLIMIENTO_RECURRENTE
      descripcion: "El incumplimiento recurrente de obligaciones puede derivar en clasificación D."
      fundamento: "LRASCAP Art. 15-III"
      automatizable: false   # decisión del CSA, no del sistema
  notificacion_asamblea:
    fundamento: "LRASCAP Art. 15-II"
    regla_general: "Informar en la sesión de asamblea inmediata siguiente."
    categoria_C_o_D: "A más tardar 30 días naturales desde el día siguiente a la notificación."
    evidencia_al_CSA:
      documentos: ["convocatoria", "acta protocolizada"]
      plazo_dias: 60
      desde: "celebración de la asamblea"

# -----------------------------------------------------------------------------
obligaciones_de_entrega:
  - id: OBL-AVISO-SUCURSALES
    fundamento: "Disposiciones Art. 1 Bis 1, párrafo 1"
    destinatario: "Socios (avisos en lugar visible de sucursales)"
    contenido: ["balance general", "estado de resultados", "notas"]
    cifras_a: ["marzo", "junio", "septiembre", "diciembre"]
    entrega_en: ["abril", "julio", "octubre", "enero"]
    medio: "cartel en sucursal"

  - id: OBL-TRIM-ELECTRONICA
    fundamento: "Disposiciones Art. 1 Bis 1, párrafo 2"
    destinatario: "Comité de Supervisión Auxiliar"
    contenido: ["balance general", "estado de resultados"]
    requisito_previo: "aprobados por el Consejo de Administración"
    formato: "Anexo U — Instructivo de entrega de información"
    cifras_a: ["marzo", "junio", "septiembre", "diciembre"]
    entrega_en: ["abril", "julio", "octubre", "enero"]
    medio: "electrónico"

  - id: OBL-SEM-IMPRESA
    fundamento: "Disposiciones Art. 1 Bis 1, párrafo 4"
    destinatario: "Comité de Supervisión Auxiliar"
    contenido: ["balance general", "estado de resultados"]
    formato: "Anexo U"
    firmas_requeridas:
      - "Presidente del Consejo de Administración"
      - "Director o Gerente General"
    cifras_a: ["junio", "diciembre"]
    plazo: "dentro del mes inmediato siguiente a la fecha de corte"
    medio: "impreso"

  - id: OBL-COMPUTO-CAPITALIZACION
    fundamento: "Disposiciones Art. 1 Bis 6"
    destinatario: "Comité de Supervisión Auxiliar"
    contenido: ["cómputo del Nivel de Capitalización"]
    formato: "formulario del Anexo U"
    cifras_a: ["marzo", "junio", "septiembre", "diciembre"]
    entrega_en: ["abril", "julio", "octubre", "enero"]
    nota_valor_legal: >
      El cómputo de la sociedad rige para todos los efectos legales, SALVO que
      el CSA verifique y obtenga un cómputo distinto, el cual será definitivo.

  - id: OBL-INFORME-ANUAL-RELACIONADAS
    fundamento: "LRASCAP Art. 26"
    destinatario: ["Asamblea General", "Consejo de Administración"]
    contenido: "monto agregado de créditos a personas relacionadas e incumplimientos observados"
    periodicidad: anual

# NO es obligación de la cooperativa:
no_son_entregables_de_la_sociedad:
  - id: A-2113
    quien_lo_presenta: "Comité de Supervisión Auxiliar → CNBV"
    fundamento: "Disposiciones Art. 1 Bis 7 (Serie R21, Anexo M; Arts. 302 y 303)"

# -----------------------------------------------------------------------------
personas_relacionadas:
  fundamento: "LRASCAP Art. 26"
  aplica_a_basico: true
  motivo_aplicabilidad: "Ubicado en Título Segundo, Capítulo III, Sección Tercera 'De las disposiciones comunes'."
  aprobacion:
    quorum: "3/4 de los consejeros PRESENTES en la sesión del Consejo de Administración"
    nota: "Presentes, no del total de consejeros."
  umbral_exencion_aprobacion:
    regla: "min(100000 UDIS, 0.02 * capital_social_pagado)"
    efecto: >
      Por debajo del umbral no se requiere aprobación del Consejo, pero debe
      hacerse de su conocimiento y ponerse la información agregada a disposición
      de la Asamblea y del Consejo, sin precisar nombres.
    limite_frecuencia: "Máximo una vez al año por persona relacionada sin aprobación."
  limite_agregado:
    regla: "(montos_dispuestos + lineas_de_credito_irrevocables_contratadas) <= 0.10 * capital_contable"
    base: capital_contable   # no capital neto, no capital social
  sujetos:
    - "Miembros del Consejo de Administración, Consejo de Vigilancia y Comité de Crédito o equivalente"
    - "Auditores externos"
    - "Cónyuges y parientes de los anteriores (consanguinidad/afinidad en línea recta 1er grado; colateral 1er grado o civil)"
    - "Funcionarios: director o gerente general y jerarquía inmediata inferior"
    - "Personas que con su firma puedan obligar a la sociedad"
  extension:
    descripcion: >
      También cuenta la operación realizada a través de cualquier persona o
      fideicomiso cuando la contraparte y fuente de pago dependa de una
      persona relacionada.
  exclusiones:
    - "Créditos de carácter laboral a trabajadores distintos de los sujetos listados."
  condiciones:
    - "No pueden celebrarse en términos más favorables que las operaciones de la misma naturaleza con Socios."
    - "Consejeros y funcionarios con interés directo o conflicto deben excusarse y abstenerse de votar."

# -----------------------------------------------------------------------------
estimaciones_preventivas:
  anexo_aplicable: "Anexo C Bis"
  titulo_anexo: >
    Procedimiento para la calificación y constitución de estimaciones preventivas
    de sociedades cooperativas de ahorro y préstamo con nivel de operaciones básico
  estado: PENDIENTE_DE_CARGA
  nota: >
    El texto del Anexo C Bis no está contenido en el PDF compilado de las
    Disposiciones (solo aparece en el listado de anexos). Debe obtenerse el
    anexo publicado en el DOF antes de implementar cualquier tabla de
    porcentajes. NO usar el Anexo C (aplicable a niveles I-IV).
  prohibido_hardcodear: true

# -----------------------------------------------------------------------------
formatos:
  anexo_T:
    titulo: "Instructivo de información financiera para SOCAP con Nivel de Operaciones Básico"
    funcion: "criterios contables y catálogo de cuentas"
    fundamento: "Disposiciones Art. 1 Bis"
    estado: PENDIENTE_DE_CARGA
  anexo_U:
    titulo: "Instructivo de entrega de información para SOCAP con Nivel de Operaciones Básico"
    funcion: "formatos de balance, estado de resultados y formulario de cómputo de capitalización"
    fundamento: "Disposiciones Arts. 1 Bis 1 y 1 Bis 6"
    estado: PENDIENTE_DE_CARGA
  advertencia: >
    T y U se confunden con frecuencia. El BALANCE QUE SE ENTREGA usa el formato
    del Anexo U, no del T. El T rige cómo se lleva la contabilidad.

# -----------------------------------------------------------------------------
# Reglas que NO aplican a Nivel Básico (registradas para bloquear su reintroducción)
excluidas_del_regimen_basico:
  - regla: "Coeficiente de liquidez 10% de pasivos a corto plazo"
    fundamento: "Disposiciones Art. 44"
    motivo: "Dirigido a 'las Sociedades' = niveles I-IV (Art. 1, fracc. LXVIII)"
  - regla: "Riesgo Común / diversificación de riesgos"
    fundamento: "Disposiciones Art. 193 Bis"
    motivo: "Mismo alcance I-IV"
    nota_parametros_reales: >
      Aun en I-IV el límite no es 20% plano: 10% del capital neto para Socios
      personas físicas, 15% para personas morales, 20% para préstamos de
      liquidez entre SOCAPs y para cooperativas del Art. 21 fracc. I y II LGSC.
      Microcrédito Productivo: 12,000 UDIS individual / 20,000 UDIS por grupo
      (máx. 2,500 UDIS por integrante), UDI a fecha de concertación.
  - regla: "Estimaciones preventivas conforme al Anexo C"
    motivo: "Para Básico rige el Anexo C Bis"
  - regla: "Cuotas al Fondo de Protección"
    fundamento: "LRASCAP Art. 28, fracc. III, inciso c)"
    motivo: "La fracción III aplica exclusivamente a niveles I-IV"
    nota: "El Art. 47 LRASCAP regula funciones del Comité Técnico, no cuotas."
  - regla: "Dictamen de auditor externo"
    fundamento: "LRASCAP Arts. 33 y 37"
    motivo: "Título Tercero, exclusivo de niveles I-IV"
  - regla: "Leyenda de aprobación que cita Arts. 32, 34 y 40 LRASCAP y 'niveles I a IV'"
    motivo: >
      Esos artículos están en el Título Tercero (I-IV). Usar esa leyenda en un
      balance de Nivel Básico es un error visible en el propio documento.
