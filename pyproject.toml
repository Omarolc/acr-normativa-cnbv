[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acr-normativa"
version = "0.1.0"
description = "Sistema de cumplimiento regulatorio para SOCAP con Nivel de Operaciones Basico"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acr.normativa" = ["*.yaml"]

# --- Compuerta A: estilo -----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # texto normativo en espanol con acentos

# --- Compuerta B: tipos ------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["src"]

# --- Compuerta C: pruebas ----------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "frontera: casos borde de umbrales normativos",
  "bloqueado: requiere anexo del DOF aun no disponible",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
